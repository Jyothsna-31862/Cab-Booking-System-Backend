server:
  port: 8088

spring:
  application:
    name: API-GATEWAY

  # Config Server
  config:
    import: "optional:configserver:http://localhost:8888"

  # Spring Cloud Gateway Configuration with Circuit Breakers
  cloud:
    gateway:
      routes:
        # USER SERVICE ROUTE
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**
          filters:
            - name: CircuitBreaker
              args:
                name: user-service
                fallbackUri: forward:/fallback/user-service

        # DRIVER SERVICE ROUTE
        - id: driver-service
          uri: lb://DRIVER-SERVICE
          predicates:
            - Path=/api/drivers/**
          filters:
            - name: CircuitBreaker
              args:
                name: driver-service
                fallbackUri: forward:/fallback/driver-service

        # RIDE SERVICE ROUTE
        - id: ride-service
          uri: lb://RIDE-SERVICE
          predicates:
            - Path=/api/rides/**
          filters:
            - name: CircuitBreaker
              args:
                name: ride-service
                fallbackUri: forward:/fallback/ride-service

        # PAYMENT SERVICE ROUTE
        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/payments/**
          filters:
            - name: CircuitBreaker
              args:
                name: payment-service
                fallbackUri: forward:/fallback/payment-service

        # RATING SERVICE ROUTE
        - id: rating-service
          uri: lb://RATING-SERVICE
          predicates:
            - Path=/api/ratings/**
          filters:
            - name: CircuitBreaker
              args:
                name: rating-service
                fallbackUri: forward:/fallback/rating-service

        # LOCATION SERVICE ROUTE
        - id: location-service
          uri: lb://LOCATION-SERVICE
          predicates:
            - Path=/api/locations/**
          filters:
            - name: CircuitBreaker
              args:
                name: location-service
                fallbackUri: forward:/fallback/location-service

        # AUTH SERVICE ROUTE (Separate configuration as requested)
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: auth-service
                fallbackUri: forward:/fallback/auth-service

  # CORS Configuration
  webflux:
    cors:
      allowed-origins: "*"
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
      allowed-headers: "*"
      allow-credentials: true

# Eureka Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Management and Actuator
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

# Resilience4j Circuit Breaker Configuration
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 5s
    instances:
      # AUTH SERVICE - Separate configuration as requested
      auth-service:
        baseConfig: default
        failureRateThreshold: 60
        waitDurationInOpenState: 15s
        slidingWindowSize: 15
        minimumNumberOfCalls: 8

      # OTHER SERVICES - Standard configuration
      user-service:
        baseConfig: default
      driver-service:
        baseConfig: default
      ride-service:
        baseConfig: default
        failureRateThreshold: 40
        waitDurationInOpenState: 20s
      payment-service:
        baseConfig: default
        failureRateThreshold: 30
        waitDurationInOpenState: 30s
      rating-service:
        baseConfig: default
      location-service:
        baseConfig: default
        failureRateThreshold: 45

# Logging Configuration
logging:
  level:
    io.github.resilience4j: DEBUG
    org.springframework.cloud.gateway: DEBUG
    root: INFO
